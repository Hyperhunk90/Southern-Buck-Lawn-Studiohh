<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Background Gradient & Patterns -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#2a3029" />
      <stop offset="60%" stop-color="#181b18" />
      <stop offset="100%" stop-color="#0f110f" />
    </radialGradient>

    <linearGradient id="brandGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#73c348" />
      <stop offset="50%" stop-color="#559933" />
      <stop offset="100%" stop-color="#3b6e22" />
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.85" />
    </filter>

    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#559933" flood-opacity="0.6" />
    </filter>

    <!-- Grass Silhouette Pattern -->
    <pattern id="grassPattern" width="400" height="200" patternUnits="userSpaceOnUse">
      <path d="M 10 200 Q 15 120 25 60 Q 30 130 35 200 M 30 200 Q 40 100 55 40 Q 60 110 65 200 M 70 200 Q 85 80 100 20 Q 110 100 115 200 M 120 200 Q 130 110 145 50 Q 150 120 155 200 M 170 200 Q 185 90 200 30 Q 210 100 215 200 M 230 200 Q 245 100 260 40 Q 270 120 275 200 M 290 200 Q 305 70 320 15 Q 330 90 335 200 M 350 200 Q 365 110 380 50 Q 390 120 395 200" fill="none" stroke="#0d100d" stroke-width="6" opacity="0.4" />
    </pattern>
  </defs>

  <!-- Dark Textured Canvas -->
  <rect width="1920" height="1080" fill="url(#bgGlow)" />

  <!-- Side Grass Silhouettes -->
  <rect x="0" y="0" width="1920" height="1080" fill="url(#grassPattern)" />

  <!-- Corner Buck Antler Silhouettes -->
  <g opacity="0.35" fill="#0d100d">
    <!-- Top Left Buck -->
    <path d="M 80 180 C 70 140 50 110 30 90 C 25 110 40 130 50 150 C 30 120 10 100 0 90 C 10 120 30 140 45 165 C 20 150 5 140 0 135 C 10 155 25 170 45 180 C 25 180 10 185 0 190 C 15 195 35 192 55 188 C 65 200 75 220 80 250 Z" />
    <!-- Top Right Buck -->
    <path d="M 1840 180 C 1850 140 1870 110 1890 90 C 1895 110 1880 130 1870 150 C 1890 120 1910 100 1920 90 C 1910 120 1890 140 1875 165 C 1900 150 1915 140 1920 135 C 1910 155 1895 170 1875 180 C 1895 180 1910 185 1920 190 C 1905 195 1885 192 1865 188 C 1855 200 1845 220 1840 250 Z" />
  </g>

  <!-- TOP SLOGAN -->
  <text x="960" y="140" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-size="52" font-weight="900" fill="#65b340" filter="url(#shadow)" letter-spacing="1.5">
    &ldquo;SouthernCare, Your Landscape Mayor&rdquo;
  </text>

  <!-- BUCK MASCOT (LEFT SIDE) -->
  <g transform="translate(180, 160)" filter="url(#shadow)">
    <!-- Mascot Image Link fallback & SVG render -->
    <image href="/images/southern-buck-lawn-mascot-waving.png" x="0" y="40" width="480" height="680" />
  </g>

  <!-- CENTER LOGO (SOUTHERN BUCK LAWN) -->
  <g transform="translate(1000, 420)" filter="url(#shadow)">
    <!-- Louisiana State Outline with SBL -->
    <image href="/images/southern-buck-lawn-logo.png" x="-320" y="-220" width="640" height="420" />
  </g>

  <!-- BOTTOM SERVICES BAR CONTAINER -->
  <g transform="translate(960, 920)" filter="url(#shadow)">
    <!-- Dark Pill Container -->
    <rect x="-520" y="-60" width="1040" height="110" rx="24" fill="#0d0f0d" stroke="#252c24" stroke-width="2" opacity="0.95" />

    <!-- 5 Service Items -->
    <!-- 1. Lawn Mowing -->
    <g transform="translate(-410, 0)">
      <path d="M-20 15 L-10 -15 L0 15 M-10 -5 L10 -5" stroke="#73c348" stroke-width="3" fill="none" />
      <text x="0" y="32" text-anchor="middle" font-family="'Arial', sans-serif" font-size="20" font-weight="bold" fill="#ffffff">Lawn Mowing</text>
    </g>

    <!-- 2. Edging & Trimming -->
    <g transform="translate(-205, 0)">
      <path d="M-12 -12 L12 12 M-12 12 L12 -12" stroke="#73c348" stroke-width="3" fill="none" />
      <text x="0" y="32" text-anchor="middle" font-family="'Arial', sans-serif" font-size="20" font-weight="bold" fill="#ffffff">Edging &amp; Trimming</text>
    </g>

    <!-- 3. Aeration -->
    <g transform="translate(0, 0)">
      <path d="M-15 10 Q0 -20 15 10 M-8 15 Q0 -10 8 15" stroke="#73c348" stroke-width="3" fill="none" />
      <text x="0" y="32" text-anchor="middle" font-family="'Arial', sans-serif" font-size="20" font-weight="bold" fill="#ffffff">Aeration</text>
    </g>

    <!-- 4. Fertilization -->
    <g transform="translate(205, 0)">
      <rect x="-12" y="-18" width="24" height="30" rx="4" stroke="#73c348" stroke-width="3" fill="none" />
      <circle cx="0" cy="-3" r="4" fill="#73c348" />
      <text x="0" y="32" text-anchor="middle" font-family="'Arial', sans-serif" font-size="20" font-weight="bold" fill="#ffffff">Fertilization</text>
    </g>

    <!-- 5. Mulching -->
    <g transform="translate(410, 0)">
      <path d="M-18 12 Q0 -8 18 12 Q0 20 -18 12 Z" fill="#8c5a2b" />
      <path d="M-5 -8 L5 -18 M2 -18 Q12 -18 12 -8" stroke="#73c348" stroke-width="3" fill="none" />
      <text x="0" y="32" text-anchor="middle" font-family="'Arial', sans-serif" font-size="20" font-weight="bold" fill="#ffffff">Mulching</text>
    </g>
  </g>
</svg>
